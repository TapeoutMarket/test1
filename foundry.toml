[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc = ".tools/solc-0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
chain_id = 56
fs_permissions = [{ access = "read", path = "./fixtures/seaport" }]
fuzz.runs = 256
invariant.runs = 128
invariant.depth = 64
invariant.fail_on_revert = false

[fmt]
line_length = 110
